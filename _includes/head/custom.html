<script>
document.addEventListener('DOMContentLoaded', function() {
  // Theme toggle
  var themeToggle = document.getElementById('theme-toggle');
  if (themeToggle) {
    themeToggle.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  }

  // Project cards -> detail page URLs (matched by title substring)
  var projectUrls = {
    'The Timebound Voyage': '/projects/timebound-voyage/',
    'Crystal Quest': '/projects/crystal-quest/',
    'Multiscale NeRF': '/projects/multiscale-nerf/',
    'Ego-Agent Trajectory Prediction': '/projects/ego-agent-trajectory-prediction/',
    'Keep your ARMS and LEGS': '/projects/fmgs_optimization/',
    'Disney BSDF': '/projects/disney-bsdf/',
    'Volumetric Path Tracing': '/projects/volumetric-path-tracing/'
  };

  document.querySelectorAll('.paper-box').forEach(function(card) {
    var titleEl = card.querySelector('.paper-box-title');
    if (!titleEl) return;

    var url = null;
    for (var title in projectUrls) {
      if (titleEl.textContent.includes(title)) {
        url = projectUrls[title];
        break;
      }
    }
    if (!url) return;

    card.classList.add('paper-box--clickable');
    card.addEventListener('click', function(e) {
      // card descriptions no longer contain real links, but guard anyway
      // in case one gets added later
      var clickedLink = e.target.closest('a');
      if (clickedLink) return;

      window.location.href = url;
    });
  });

  // Handle navigation links
  const navLinks = document.querySelectorAll('.masthead__menu-item a');
  navLinks.forEach(function(link) {
    link.addEventListener('click', function(e) {
      const href = this.getAttribute('href');
      // If we're on a project page and the link points to homepage anchors
      if (window.location.pathname !== '/' && href.startsWith('/#')) {
        e.preventDefault();
        // Navigate to homepage with the anchor
        window.location.href = href;
      }
    });
  });
});
</script>
